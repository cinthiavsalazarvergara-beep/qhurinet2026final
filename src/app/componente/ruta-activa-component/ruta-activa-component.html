<div class="cabecera">
  <div class="kicker">RUTA ACTIVA</div>
  <div class="cifras">
    <div class="kg">{{ kg }}</div>
    <div class="meta">{{ meta }}</div>
  </div>
</div>
<div class="cuerpo">
  <div class="distancia"><span>{{ distancia }}</span><span>{{ minutos }} min</span></div>
  @if (aviso) { <div role="status" class="aviso">{{ aviso }}</div> }
  @if (!paradas.length) { <div class="vacia">Tu ruta no tiene paradas. Agrega un punto o reclama un anuncio.</div> }
  @for (p of paradas; track p.id) {
    <div class="parada" [attr.data-route-stop]="p.id">
      <span class="numero">{{ p.number }}</span>
      <div class="parada-texto">
        <button type="button" class="map-button parada-nombre" (click)="abrirParada.emit(p.id)">{{ p.name }}</button>
        <div class="parada-detalle">{{ p.detail }}</div>
      </div>
      <button type="button" class="flow-button quitar" [attr.aria-label]="'Quitar parada ' + p.name" (click)="quitarParada.emit(p.id)">×</button>
    </div>
  }
  <div class="separador"></div>
  @if (puedeEscanear) {
    <div class="botones">
      <button type="button" class="escanear" (click)="escanear.emit()">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" fill="none" stroke="currentColor" stroke-width="2"></rect><rect x="14" y="4" width="6" height="6" fill="none" stroke="currentColor" stroke-width="2"></rect><rect x="4" y="14" width="6" height="6" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M14 14 H20 V20 H14 Z" fill="none" stroke="currentColor" stroke-width="2"></path></svg>
        Escanear QR
      </button>
      <button type="button" class="chat" title="Abrir chat" aria-label="Abrir chat" (click)="chat.emit()">
        <svg viewBox="0 0 24 24"><path d="M3 5 H21 V16 H12 L7 20 V16 H3 Z" fill="none" stroke="currentColor" stroke-width="2"></path></svg>
      </button>
    </div>
  }
</div>
