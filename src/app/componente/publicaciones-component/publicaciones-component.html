<div class="pantalla">
  <div>
    @if (error) { <div role="alert" class="error">{{ error }}</div> }
    <app-tabla-entregas-component modo="anuncios" [filas]="filas" [pestana]="pestana" (accion)="onAccion($event)" />
  </div>

  <app-resumen-mes-component kgLabel="kg entregados" countLabel="entregas" />
</div>

@if (dialogo && entregaAccion) {
  <app-accion-dialog-component [entrega]="entregaAccion" [tipo]="dialogo" (completado)="onCompletado()" (cerrar)="cerrarDialogo()" />
}
@if (entregaSeguimiento) {
  <app-seguimiento-dialog-component [entrega]="entregaSeguimiento" (cerrar)="entregaSeguimiento = null" />
}
@if (entregaValorar) {
  <app-valorar-dialog-component [entrega]="entregaValorar" [esGenerador]="true" (cerrar)="entregaValorar = null" />
}
