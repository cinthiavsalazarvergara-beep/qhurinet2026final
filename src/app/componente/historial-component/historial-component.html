<div class="cabecera">
  <div class="titulo">Historial de actividad</div>
  <div class="botones">
    <button type="button" class="exportar" (click)="exportar.emit('pdf')" title="Imprimir o guardar como PDF">PDF</button>
    <button type="button" class="exportar" (click)="exportar.emit('csv')" title="Descargar historial en CSV">CSV</button>
  </div>
</div>

<table mat-table [dataSource]="dataSource" matSort class="tabla">
  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>TIPO</th>
    <td mat-cell *matCellDef="let h" class="negrita">{{ h.type }}</td>
  </ng-container>
  <ng-container matColumnDef="material">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>MATERIAL</th>
    <td mat-cell *matCellDef="let h">{{ h.material }}</td>
  </ng-container>
  <ng-container matColumnDef="party">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>CONTRAPARTE</th>
    <td mat-cell *matCellDef="let h">{{ h.party }}</td>
  </ng-container>
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>FECHA</th>
    <td mat-cell *matCellDef="let h" class="fecha">{{ h.date }}</td>
  </ng-container>
  <ng-container matColumnDef="rating">
    <th mat-header-cell *matHeaderCellDef>VALORACIÓN</th>
    <td mat-cell *matCellDef="let h" class="mono">{{ h.rating }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Página del historial"></mat-paginator>
